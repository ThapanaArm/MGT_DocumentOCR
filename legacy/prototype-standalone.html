<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR to SAP S/4HANA — AP &amp; Sales Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* =====================================================================
     Design tokens — อ้างอิงระบบดีไซน์ของ bitkub.com (bk-global tokens)
     ฟอนต์จริงของ Bitkub คือ "Graphik TH" (ลิขสิทธิ์เชิงพาณิชย์)
     ถ้าเครื่องมีติดตั้งไว้จะถูกใช้ก่อน มิฉะนั้น fallback เป็น Anuphan (ทรงใกล้เคียง)
     ===================================================================== */
  :root{
    /* palette */
    --bk-black:#0c0e0c; --bk-white:#ffffff;
    --g100:#f1f3f2; --g200:#e4e7e5; --g300:#d6dbd8; --g500:#bbc4be;
    --g700:#a0aca4; --g1100:#6b7b70; --g1200:#5f6d64; --g1600:#2f3732; --g1700:#242925; --g1800:#181b19;
    --gr100:#e5fff2; --gr300:#b3ffd9; --gr1200:#00cc66; --gr1300:#00b359; --gr1400:#00994d; --gr1600:#006633;
    --rd100:#fde8e7; --rd300:#f9b9b8; --rd800:#f04542; --rd1200:#bd120f;
    --yl100:#fef8e6; --yl1000:#f9b806; --yl1200:#c79305;
    --bl100:#e6f5fe; --bl1100:#0690e0;

    /* semantic */
    --bg:var(--g100); --card:var(--bk-white); --nav-bg:var(--bk-white);
    --line:var(--g200); --line-soft:var(--g100);
    --text:var(--bk-black); --muted:var(--g1100); --text-3:var(--g700);
    --brand:var(--gr1400); --brand-h:#007a3d; --brand-soft:var(--gr100); --brand-line:var(--gr300);
    --blue:var(--gr1400); --blue-d:#007a3d;                     /* legacy alias */
    --green:var(--gr1400); --green-bg:var(--gr100);
    --red:var(--rd1200); --red-bg:var(--rd100);
    --orange:var(--yl1200); --orange-bg:var(--yl100);
    --info:var(--bl1100); --info-bg:var(--bl100);
    --btn-dark:var(--bk-black); --btn-dark-h:#1f241f;
    --code-bg:var(--bk-black); --code-fg:#ccffe5;

    /* radius (bk-global-border-radius) */
    --r1:2px; --r2:4px; --r3:8px; --r4:16px; --r5:20px; --r6:32px; --pill:100px;
    --radius:16px;
    /* shadow (bk-global-shadow) */
    --sh1:0 4px 8px 2px #0000000a,0 -1px 8px 0 #00000005;
    --sh3:0 8px 16px 4px #0000001a,0 -1px 4px 0 #0000001a;
    --sh4:0 16px 32px 8px #0000001a,0 -1px 12px 0 #0000001a;
    --shadow:var(--sh1);
    --font:'Graphik TH','Anuphan','IBM Plex Sans Thai','Noto Sans Thai','Inter',-apple-system,'Segoe UI',Tahoma,sans-serif;
  }
  [data-theme="dark"]{
    --bg:var(--bk-black); --card:var(--g1800); --nav-bg:var(--g1800);
    --line:var(--g1600); --line-soft:var(--g1700);
    --text:#ffffff; --muted:var(--g700); --text-3:var(--g1100);
    --brand:var(--gr1200); --brand-h:var(--gr1300); --brand-soft:rgba(0,204,102,.12); --brand-line:rgba(0,204,102,.35);
    --blue:var(--gr1200); --blue-d:var(--gr1300);
    --green:var(--gr1200); --green-bg:rgba(0,204,102,.12);
    --red:var(--rd800); --red-bg:rgba(240,69,66,.14);
    --orange:var(--yl1000); --orange-bg:rgba(249,184,6,.14);
    --btn-dark:var(--gr1200); --btn-dark-h:var(--gr1300);
    --code-bg:#000; --sh1:none; --shadow:none;
  }

  *{box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);
       font-size:15px;line-height:24px;letter-spacing:.01em}
  button{font-family:inherit;font-size:15px;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:15px;color:inherit}
  h1,h2,h3{letter-spacing:-.01em}

  /* ---------- Layout ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{width:248px;background:var(--nav-bg);color:var(--text);flex-shrink:0;display:flex;flex-direction:column;
           border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
  .brand{padding:22px 20px 16px}
  .brand b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:26px}
  .brand b:before{content:'';display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--brand);margin-right:8px;vertical-align:middle}
  .brand span{font-size:12px;color:var(--muted);letter-spacing:.02em}
  .nav{padding:6px 12px;flex:1;overflow:auto}
  .nav-title{font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--text-3);padding:16px 12px 6px}
  .nav a{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:var(--pill);color:var(--g1200);
         text-decoration:none;margin-bottom:2px;font-size:14px;font-weight:500;transition:background .15s,color .15s}
  [data-theme="dark"] .nav a{color:var(--muted)}
  .nav a:hover{background:var(--line-soft);color:var(--text)}
  .nav a.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .nav a .ic{width:18px;text-align:center;font-size:15px}
  .sidebar-foot{padding:14px 20px;font-size:12px;line-height:20px;color:var(--muted);border-top:1px solid var(--line)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:var(--card);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:20}
  .topbar h1{font-size:22px;margin:0;font-weight:600;line-height:32px}
  .topbar .sp{flex:1}
  .modtag{display:inline-flex;align-items:center;gap:6px;background:var(--brand-soft);color:var(--brand);
          padding:5px 14px;border-radius:var(--pill);font-size:13px;font-weight:600}
  .content{padding:24px 28px 72px;max-width:1560px;width:100%}

  /* ---------- Common ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r4);box-shadow:var(--sh1);margin-bottom:20px;overflow:hidden}
  .card-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .card-h h2{font-size:17px;margin:0;font-weight:600;line-height:26px}
  .card-h .sp{flex:1}
  .card-b{padding:20px}
  .btn{border:1px solid var(--g300);background:var(--card);color:var(--text);padding:9px 18px;border-radius:var(--pill);
       font-weight:500;font-size:14px;line-height:22px;display:inline-flex;align-items:center;gap:8px;transition:.15s;white-space:nowrap}
  [data-theme="dark"] .btn{border-color:var(--g1600)}
  .btn:hover{background:var(--line-soft);border-color:var(--g500)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .btn.primary:hover{background:var(--brand-h);border-color:var(--brand-h)}
  [data-theme="dark"] .btn.primary{color:var(--bk-black)}
  .btn.success{background:var(--btn-dark);border-color:var(--btn-dark);color:#fff;font-weight:600}
  .btn.success:hover{background:var(--btn-dark-h);border-color:var(--btn-dark-h)}
  [data-theme="dark"] .btn.success{color:var(--bk-black)}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:var(--line-soft)}
  .btn.sm{padding:6px 14px;font-size:13px;line-height:20px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:hover{background:var(--card);border-color:var(--g300)}
  .muted{color:var(--muted)}
  .hint{font-size:13px;line-height:20px;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

  .badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:var(--pill);font-size:12px;
         line-height:18px;font-weight:600;white-space:nowrap}
  .b-ok{background:var(--green-bg);color:var(--green)}
  .b-fail{background:var(--red-bg);color:var(--red)}
  .b-warn{background:var(--orange-bg);color:var(--orange)}
  .b-idle{background:var(--line-soft);color:var(--muted)}

  /* ---------- Steps ---------- */
  .steps{display:flex;margin-bottom:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r4);overflow:hidden;box-shadow:var(--sh1)}
  .step{flex:1;padding:16px 18px;display:flex;gap:12px;align-items:center;border-right:1px solid var(--line)}
  .step:last-child{border-right:0}
  .step .n{width:28px;height:28px;border-radius:50%;background:var(--line-soft);color:var(--muted);display:flex;
           align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0}
  .step .t{font-size:12px;line-height:18px;color:var(--muted)}
  .step .t b{display:block;font-size:14px;line-height:22px;color:var(--text);font-weight:600}
  .step.on{background:var(--brand-soft)}
  .step.on .n{background:var(--brand);color:#fff}
  .step.done .n{background:var(--brand-soft);color:var(--brand)}
  [data-theme="dark"] .step.on .n{color:var(--bk-black)}

  /* ---------- Module picker ---------- */
  .modules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
  .mod{border:1px solid var(--line);border-radius:var(--r4);padding:24px;background:var(--card);cursor:pointer;transition:.18s}
  .mod:hover{border-color:var(--brand);box-shadow:var(--sh3);transform:translateY(-2px)}
  .mod.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:var(--sh1)}
  .mod .ic{font-size:30px;line-height:1}
  .mod h3{margin:14px 0 6px;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .mod p{margin:0;font-size:14px;color:var(--muted);line-height:22px}
  .mod ul{margin:14px 0 0;padding-left:20px;font-size:13px;color:var(--muted);line-height:24px}

  /* ---------- Upload ---------- */
  .drop{border:1.5px dashed var(--g300);border-radius:var(--r4);padding:44px 24px;text-align:center;background:var(--line-soft);transition:.15s}
  .drop.over{border-color:var(--brand);background:var(--brand-soft)}
  .drop .big{font-size:38px;line-height:1}
  .filechip{display:inline-flex;align-items:center;gap:8px;background:var(--line-soft);border:1px solid var(--line);
            padding:5px 14px;border-radius:var(--pill);font-size:13px;color:var(--muted)}
  .bar{height:6px;background:var(--g200);border-radius:var(--pill);overflow:hidden;margin-top:14px}
  [data-theme="dark"] .bar{background:var(--g1600)}
  .bar > i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s;border-radius:var(--pill)}

  /* ---------- Fields ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px 18px}
  .f label{display:block;font-size:12px;line-height:18px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .f input,.f select,.f textarea{width:100%;padding:10px 13px;border:1px solid var(--g300);border-radius:var(--r3);
        background:var(--card);font-size:14px;line-height:22px;transition:.15s}
  [data-theme="dark"] .f input,[data-theme="dark"] .f select{border-color:var(--g1600)}
  .f input:focus,.f select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,204,102,.18)}
  .f input[readonly]{background:var(--line-soft);color:var(--muted)}
  .f .sub{font-size:12px;margin-top:7px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .f.err input,.f.err select{border-color:var(--red);background:var(--red-bg)}
  .f.ok input,.f.ok select{border-color:var(--brand-line)}

  /* ---------- Table ---------- */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r4)}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:780px}
  th{background:var(--line-soft);text-align:left;padding:11px 14px;font-size:12px;line-height:18px;color:var(--muted);
     font-weight:600;letter-spacing:.02em;border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:9px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;line-height:22px}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--line-soft)}
  td input,td select{width:100%;padding:6px 9px;border:1px solid transparent;border-radius:var(--r2);background:transparent;font-size:14px}
  td input:hover,td select:hover{border-color:var(--g300);background:var(--card)}
  td input:focus,td select:focus{border-color:var(--brand);background:var(--card);outline:none;box-shadow:0 0 0 3px rgba(0,204,102,.15)}
  td.num input{text-align:right;font-variant-numeric:tabular-nums}
  .cell-fail select,.cell-fail input{border-color:var(--red);background:var(--red-bg)}
  .totrow td{background:var(--line-soft);font-weight:600;font-variant-numeric:tabular-nums}

  /* ---------- Result panel ---------- */
  .result{border-radius:var(--r4);padding:18px 20px;margin-bottom:20px;border:1px solid}
  .result.ok{background:var(--green-bg);border-color:var(--brand-line);color:var(--gr1600)}
  .result.bad{background:var(--red-bg);border-color:var(--rd300);color:var(--rd1200)}
  [data-theme="dark"] .result.ok{color:var(--gr1200)}
  [data-theme="dark"] .result.bad{color:var(--rd800)}
  .result h3{margin:0 0 8px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .result ul{margin:10px 0 0;padding-left:22px;line-height:26px;font-size:14px}
  .result code{background:rgba(12,14,12,.08);padding:2px 7px;border-radius:var(--r2);font-size:13px}
  [data-theme="dark"] .result code{background:rgba(255,255,255,.12)}
  .result .hint{color:inherit;opacity:.75}

  pre.json{background:var(--code-bg);color:var(--code-fg);padding:18px;border-radius:var(--r3);overflow:auto;
           font-family:'SF Mono',Consolas,monospace;font-size:12.5px;line-height:1.7;max-height:440px;margin:0}
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);padding:0 20px;flex-wrap:wrap}
  .tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:13px 6px;margin-right:10px;
               color:var(--muted);font-weight:500;font-size:14px}
  .tabs button:hover{color:var(--text)}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

  /* ---------- Modal ---------- */
  .ov{position:fixed;inset:0;background:rgba(12,14,12,.6);backdrop-filter:blur(4px);display:none;align-items:center;
      justify-content:center;z-index:100;padding:24px}
  .ov.on{display:flex}
  .modal{background:var(--card);border-radius:var(--r5);width:min(640px,100%);max-height:88vh;overflow:auto;box-shadow:var(--sh4)}
  .modal .card-h{position:sticky;top:0;background:var(--card);z-index:1}
  .toast{position:fixed;right:24px;bottom:24px;background:var(--bk-black);color:#fff;padding:14px 20px;border-radius:var(--r3);
         box-shadow:var(--sh4);z-index:200;display:none;font-size:14px;line-height:22px;max-width:400px;border:1px solid var(--g1600)}
  .toast.on{display:block;animation:pop .25s}
  @keyframes pop{from{transform:translateY(10px);opacity:0}}
  .sec-title{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.06em;margin:0 0 14px;
             padding-bottom:8px;border-bottom:1px solid var(--line)}
  .empty{padding:48px;text-align:center;color:var(--muted)}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--g300);border-radius:var(--pill);border:2px solid var(--bg)}
  [data-theme="dark"] ::-webkit-scrollbar-thumb{background:var(--g1600)}
</style>
</head>
<body>
<div class="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="brand">
      <b>OCR &rarr; SAP S/4HANA</b>
      <span>Document Intake Automation</span>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-title">PROCESS</div>
      <a href="#" data-page="home" class="active"><span class="ic">&#9635;</span> เลือกโมดูล</a>
      <a href="#" data-page="work"><span class="ic">&#9781;</span> นำเข้าเอกสาร / OCR</a>
      <div class="nav-title">MASTER DATA</div>
      <a href="#" data-page="master"><span class="ic">&#9873;</span> Master Mapping</a>
      <div class="nav-title">LOG</div>
      <a href="#" data-page="log"><span class="ic">&#9783;</span> ประวัติส่ง SAP</a>
    </nav>
    <div class="sidebar-foot">
      Connection: <span id="connState" style="color:var(--brand);font-weight:600">● S4H-PRD (mock)</span><br>
      User: it-digital@megachem
    </div>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <div class="topbar">
      <h1 id="pageTitle">เลือกโมดูล</h1>
      <span class="modtag" id="modTag" style="display:none"></span>
      <div class="sp"></div>
      <button class="btn sm ghost" id="themeBtn" onclick="toggleTheme()" title="สลับโหมดสว่าง/มืด">&#9789;</button>
      <button class="btn sm" onclick="resetDoc()">&#8635; เริ่มเอกสารใหม่</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>

const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(String(v==null?'':v).replace(/[, ]/g,'')); return isNaN(n)?0:n; };
const fmt = n => num(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const digits = s => String(s||'').replace(/\D/g,'');

function norm(s){
  return String(s||'').toLowerCase()
    .replace(/บริษัท|จำกัด|มหาชน|หจก\.|ห้างหุ้นส่วนจำกัด|co\.,?\s*ltd\.?|company|limited|public|pcl\.?|corp\.?|inc\.?/g,'')
    .replace(/[^a-z0-9ก-๙]/g,'');
}
/* Dice coefficient บน bigram — ใช้เทียบชื่อแบบยืดหยุ่น */
function sim(a,b){
  a=norm(a); b=norm(b);
  if(!a||!b) return 0;
  if(a===b) return 1;
  if(a.includes(b)||b.includes(a)) return .92;
  const bg = s => { const o=[]; for(let i=0;i<s.length-1;i++) o.push(s.slice(i,i+2)); return o; };
  const A=bg(a), B=bg(b); if(!A.length||!B.length) return 0;
  const pool=B.slice(); let hit=0;
  A.forEach(x=>{ const i=pool.indexOf(x); if(i>-1){hit++;pool.splice(i,1);} });
  return 2*hit/(A.length+B.length);
}
const TH_AUTO = .82,        // เกณฑ์จับคู่อัตโนมัติของ "ชื่อคู่ค้า"
      TH_MAT_SCOPE = .85,   // เกณฑ์จับคู่ชื่อสินค้าภายใต้คู่ค้ารายเดียวกัน
      TH_MAT_MASTER = .93,  // เกณฑ์จับคู่กับ Material master โดยตรง (เข้มกว่า กันจับผิดตัว)
      TH_SUGGEST = .45;

/* =======================================================================
   5) MAPPING ENGINE
   ======================================================================= */
function R(status, code, text, method, cands){ return {status, code:code||'', text:text||'', method:method||'', cands:cands||[]}; }

function matchPartner(list, taxId, name){
  const t = digits(taxId);
  if(t.length>=10){
    const hit = list.find(x=>digits(x.taxId)===t);
    if(hit) return {hit, method:'เลขทะเบียนนิติบุคคล (Tax ID)', score:1};
  }
  let best=null, bs=0;
  list.forEach(x=>{
    const sc = Math.max(sim(name,x.name), sim(name,x.nameEn||''));
    if(sc>bs){bs=sc;best=x;}
  });
  if(best && bs>=TH_AUTO) return {hit:best, method:'ชื่อ ('+Math.round(bs*100)+'%)', score:bs};
  const cands = list.map(x=>({o:x, s:Math.max(sim(name,x.name), sim(name,x.nameEn||''))}))
                    .filter(c=>c.s>=TH_SUGGEST).sort((a,b)=>b.s-a.s).slice(0,3).map(c=>c.o);
  return {hit:null, method:'', score:bs, cands};
}

function matchMaterial(partnerCode, extCode, extDesc, mapList, keyField){
  const scope = mapList.filter(m=>m[keyField]===partnerCode);
  const ec = String(extCode||'').trim().toUpperCase();
  if(ec){
    const hit = scope.find(m=>String(m.extCode).trim().toUpperCase()===ec);
    if(hit) return {code:hit.materialCode, method:'รหัสสินค้าของคู่ค้า', score:1};
  }
  let best=null, bs=0;
  scope.forEach(m=>{ const sc=sim(extDesc,m.extDesc); if(sc>bs){bs=sc;best=m;} });
  if(best && bs>=TH_MAT_SCOPE) return {code:best.materialCode, method:'ชื่อสินค้าของคู่ค้า ('+Math.round(bs*100)+'%)', score:bs};
  // fallback: เทียบกับ description ของ Material master
  let b2=null, s2=0;
  MD.materials.forEach(m=>{ const sc=Math.max(sim(extDesc,m.desc), sim(extCode,m.code)); if(sc>s2){s2=sc;b2=m;} });
  if(b2 && s2>=TH_MAT_MASTER) return {code:b2.code, method:'Material master ('+Math.round(s2*100)+'%)', score:s2};
  const cands=[];
  scope.filter(m=>sim(extDesc,m.extDesc)>=TH_SUGGEST).forEach(m=>cands.push(m.materialCode));
  MD.materials.filter(m=>sim(extDesc,m.desc)>=TH_SUGGEST).forEach(m=>{ if(!cands.includes(m.code)) cands.push(m.code); });
  return {code:'', method:'', score:Math.max(bs,s2), cands:cands.slice(0,3)};
}

function runMapping(){
  const d=S.doc, h=d.header, m={header:{}, lines:[], errors:[], warns:[]};
  const manual = (S.map && S.map.manual) ? S.map.manual : {header:{}, lines:{}};
  m.manual = manual;

  if(S.module==='SO'){
    /* --- Customer --- */
    let custCode = manual.header.customer || '';
    if(custCode){
      const c = MD.customers.find(x=>x.code===custCode);
      m.header.customer = R('manual', c.code, c.name, 'เลือกด้วยตนเอง');
    }else{
      const r = matchPartner(MD.customers, h.customerTaxId, h.customerName);
      m.header.customer = r.hit ? R('ok', r.hit.code, r.hit.name, r.method)
        : R('fail','','', '', r.cands);
      if(!r.hit) m.errors.push({field:'Customer', msg:'ไม่พบลูกค้าที่ตรงกับเลขทะเบียน <code>'+esc(h.customerTaxId||'-')+'</code> หรือชื่อ &quot;'+esc(h.customerName||'-')+'&quot;', fix:'สร้าง/แก้ไขที่ Master Mapping &rarr; ลูกค้า (Customer)'});
    }
    const custCodeFinal = m.header.customer.code;

    /* --- Ship-to --- */
    let stCode = manual.header.shipTo || '';
    if(stCode){
      const s = MD.shipTos.find(x=>x.code===stCode);
      m.header.shipTo = R('manual', s.code, s.name, 'เลือกด้วยตนเอง');
    }else if(!custCodeFinal){
      m.header.shipTo = R('fail','','','',[]);
      m.errors.push({field:'Ship-to', msg:'ยังระบุ Ship-to ไม่ได้ เนื่องจากยังไม่ทราบลูกค้า', fix:'ระบุลูกค้าให้ถูกต้องก่อน'});
    }else{
      const scope = MD.shipTos.filter(x=>x.customerCode===custCodeFinal);
      let best=null,bs=0;
      scope.forEach(x=>{ const sc=Math.max(sim(h.shipToName,x.name), sim(h.shipToAddress,x.address)); if(sc>bs){bs=sc;best=x;} });
      if(best && bs>=.7){ m.header.shipTo = R('ok', best.code, best.name, 'ชื่อ/ที่อยู่ ('+Math.round(bs*100)+'%)'); }
      else{
        m.header.shipTo = R('fail','','','', scope.map(x=>x.code).slice(0,3));
        m.errors.push({field:'Ship-to', msg:'ไม่พบสถานที่ส่งของ &quot;'+esc(h.shipToName||'-')+'&quot; ของลูกค้ารายนี้', fix:'เพิ่มที่ Master Mapping &rarr; Ship-to'});
      }
    }

    /* --- Material lines --- */
    d.lines.forEach((ln,i)=>{
      const mv = manual.lines[i];
      if(mv){ m.lines.push(R('manual', mv, matDesc(mv), 'เลือกด้วยตนเอง')); return; }
      if(!custCodeFinal){
        m.lines.push(R('fail','','','',[]));
        if(i===0) m.errors.push({field:'Material (ทุกบรรทัด)', msg:'ยังจับคู่สินค้าไม่ได้ เนื่องจากยังระบุลูกค้าไม่สำเร็จ', fix:'ระบุลูกค้าให้ถูกต้องก่อน แล้วกด Mapping อีกครั้ง'});
        return;
      }
      const r = matchMaterial(custCodeFinal, ln.extCode, ln.desc, MD.custMaterials, 'customerCode');
      if(r.code) m.lines.push(R('ok', r.code, matDesc(r.code), r.method));
      else{
        m.lines.push(R('fail','','','', r.cands));
        m.errors.push({field:'Material บรรทัดที่ '+(i+1), msg:'ไม่พบสินค้า <code>'+esc(ln.extCode||'-')+'</code> / &quot;'+esc(ln.desc||'-')+'&quot; ในรายการสินค้าของลูกค้า', fix:'เพิ่มที่ Master Mapping &rarr; สินค้าฝั่งลูกค้า'});
      }
    });
  }else{
    /* ================= AP ================= */
    let vc = manual.header.vendor || '';
    if(vc){
      const v = MD.vendors.find(x=>x.code===vc);
      m.header.vendor = R('manual', v.code, v.name, 'เลือกด้วยตนเอง');
    }else{
      const r = matchPartner(MD.vendors, h.vendorTaxId, h.vendorName);
      m.header.vendor = r.hit ? R('ok', r.hit.code, r.hit.name, r.method) : R('fail','','','', r.cands);
      if(!r.hit) m.errors.push({field:'Vendor / Supplier', msg:'ไม่พบผู้ขายที่ตรงกับเลขทะเบียน <code>'+esc(h.vendorTaxId||'-')+'</code> หรือชื่อ &quot;'+esc(h.vendorName||'-')+'&quot;', fix:'สร้าง/แก้ไขที่ Master Mapping &rarr; ผู้ขาย (Vendor)'});
    }
    const vCode = m.header.vendor.code;

    d.lines.forEach((ln,i)=>{
      const mv = manual.lines[i];
      if(mv){ m.lines.push(R('manual', mv, matDesc(mv), 'เลือกด้วยตนเอง')); return; }
      if(!vCode){
        m.lines.push(R('fail','','','',[]));
        if(i===0) m.errors.push({field:'Material (ทุกบรรทัด)', msg:'ยังจับคู่สินค้าไม่ได้ เนื่องจากยังระบุผู้ขายไม่สำเร็จ', fix:'ระบุผู้ขายให้ถูกต้องก่อน แล้วกด Mapping อีกครั้ง'});
        return;
      }
      const r = matchMaterial(vCode, ln.extCode, ln.desc, MD.vendorMaterials, 'vendorCode');
      if(r.code) m.lines.push(R('ok', r.code, matDesc(r.code), r.method));
      else{
        m.lines.push(R('fail','','','', r.cands));
        m.errors.push({field:'Material บรรทัดที่ '+(i+1), msg:'ไม่พบสินค้า <code>'+esc(ln.extCode||'-')+'</code> / &quot;'+esc(ln.desc||'-')+'&quot; ในรายการสินค้าของผู้ขาย', fix:'เพิ่มที่ Master Mapping &rarr; สินค้าฝั่งผู้ขาย'});
      }
    });

    /* ตรวจภาษี */
    const calcVat = Math.round(num(h.subTotal)*num(h.vatRate)/100*100)/100;
    if(Math.abs(calcVat-num(h.vatAmount))>1)
      m.warns.push('VAT ที่อ่านได้ '+fmt(h.vatAmount)+' ไม่ตรงกับที่คำนวณ '+fmt(calcVat)+' (ฐาน '+fmt(h.subTotal)+' × '+num(h.vatRate)+'%)');
  }

  /* ตรวจจำนวน/ราคา และยอดรวม */
  d.lines.forEach((ln,i)=>{
    if(num(ln.qty)<=0) m.errors.push({field:'จำนวน บรรทัดที่ '+(i+1), msg:'จำนวนต้องมากกว่า 0', fix:'แก้ไขค่าในตาราง Detail'});
    if(num(ln.price)<=0) m.warns.push('บรรทัดที่ '+(i+1)+' ราคาต่อหน่วยเป็น 0');
  });
  const sum = d.lines.reduce((a,l)=>a+num(l.amount),0);
  const base = S.module==='AP' ? num(d.header.subTotal) : num(d.header.totalAmount);
  if(Math.abs(sum-base)>1) m.warns.push('ผลรวมรายการ '+fmt(sum)+' ไม่ตรงกับยอดในหัวเอกสาร '+fmt(base));

  m.pass = m.errors.length===0;
  S.map = m;
  return m;
}
function matDesc(code){ const m=MD.materials.find(x=>x.code===code); return m?m.desc:code; }

function bindDrop(){
  const d=$('#drop'), f=$('#fileIn');
  if(!d) return;
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('over')}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',ev=>{ const file=ev.dataTransfer.files[0]; if(file) runOCR(null,file.name); });
  f.addEventListener('change',()=>{ if(f.files[0]) runOCR(null,f.files[0].name); });
}

/* ---- จุดต่อ OCR จริง: แทน setTimeout ด้วย fetch('/api/ocr') แล้ว map ผลลัพธ์เป็น {header, lines} ---- */
function runOCR(idx, fileName){
  const pool = SAMPLES[S.module];
  const s = pool[idx!=null?idx:Math.floor(Math.random()*pool.length)];
  const p=$('#prog'), b=$('#progBar'), t=$('#progText');
  const stages=['กำลังอัปโหลดไฟล์…','ปรับภาพ / ตัดขอบ / แก้ความเอียง…','กำลังอ่านตัวอักษร (OCR Engine)…','แยกโครงสร้าง Header / Detail…','เสร็จสิ้น'];
  if(p){ p.style.display='block'; }
  let i=0;
  const tick=()=>{
    if(t) t.textContent=stages[i];
    if(b) b.style.width=((i+1)/stages.length*100)+'%';
    if(++i<stages.length) setTimeout(tick, 320);
    else setTimeout(()=>{
      S.file = fileName || s.name;
      S.doc = JSON.parse(JSON.stringify({header:s.header, lines:s.lines, confidence:s.confidence}));
      S.map=null; S.posted=false;
      render();
      toast('อ่านเอกสารสำเร็จ — ความมั่นใจ '+Math.round(s.confidence*100)+'% | พบ '+s.lines.length+' รายการ');
    }, 300);
  };
  tick();
}

      <button class="btn sm" onclick="S.doc=null;S.map=null;S.posted=false;renderWork()">เปลี่ยนเอกสาร</button>
    </div>
    <div class="card-b">
      <p class="sec-title">HEADER — ข้อมูลส่วนหัว</p>
      <div class="grid">${fields}</div>
      ${mp?'<p class="sec-title" style="margin-top:20px">HEADER MAPPING &rarr; SAP</p>'+mapHead:''}
    </div>
  </div>

  <div class="card">
    <div class="card-h"><h2>DETAIL — รายการสินค้า (${S.doc.lines.length} บรรทัด)</h2><div class="sp"></div>
      <button class="btn sm" onclick="addLine()">&#43; เพิ่มบรรทัด</button></div>
    <div class="card-b">
      <div class="tw"><table>
        <thead><tr><th style="width:50px">Item</th><th style="width:150px">รหัสสินค้า (คู่ค้า)</th><th>ชื่อสินค้าตามเอกสาร</th>
          <th style="width:90px">จำนวน</th><th style="width:70px">หน่วย</th><th style="width:100px">ราคา/หน่วย</th><th style="width:110px">จำนวนเงิน</th>
          <th>Material (SAP)</th><th>สถานะ</th><th style="width:40px"></th></tr></thead>
        <tbody>${rows||'<tr><td colspan="10" class="empty">ไม่มีรายการ</td></tr>'}</tbody>
        <tfoot><tr class="totrow"><td colspan="6" style="text-align:right">รวม</td><td style="text-align:right">${fmt(sum)}</td><td colspan="3"></td></tr></tfoot>
      </table></div>
    </div>
  </div>

  <div class="card"><div class="card-b row">
    <button class="btn primary" onclick="doMapping()">&#128269; ขั้นตอนที่ 3 — Mapping ข้อมูล</button>
    <button class="btn success" onclick="postSAP()" ${(mp&&mp.pass&&!S.posted)?'':'disabled'}>&#9099; ขั้นตอนที่ 4 — ส่งเข้า SAP S/4HANA</button>
    <button class="btn" onclick="showPayload()" ${mp&&mp.pass?'':'disabled'}>&#123;&#125; ดู Payload ที่จะส่ง</button>
    <div class="sp" style="flex:1"></div>
    <span class="hint">${S.posted?'เอกสารนี้ส่งเข้า SAP แล้ว':(mp?(mp.pass?'พร้อมส่งเข้า SAP':'แก้ไขข้อมูลที่ไม่ผ่านก่อนส่ง'):'กด Mapping เพื่อตรวจสอบกับ Master Data')}</span>
  </div></div>`;
}

function optionsFor(kind){
  if(kind==='customers') return MD.customers.map(c=>({v:c.code,t:c.code+' — '+c.name}));
  if(kind==='vendors')   return MD.vendors.map(c=>({v:c.code,t:c.code+' — '+c.name}));
  if(kind==='shipTos'){
    const cc = S.map && S.map.header.customer ? S.map.header.customer.code : '';
    return MD.shipTos.filter(s=>!cc||s.customerCode===cc).map(s=>({v:s.code,t:s.code+' — '+s.name}));
  }
  return [];
}
function editLine(i,k,v){ S.doc.lines[i][k]=v; if(k==='qty'||k==='price') S.doc.lines[i].amount=(num(S.doc.lines[i].qty)*num(S.doc.lines[i].price)).toFixed(2); S.map=null; renderWork(); }
function addLine(){ S.doc.lines.push({extCode:'',desc:'',qty:'0',uom:'EA',price:'0',amount:'0.00'}); S.map=null; renderWork(); }
function delLine(i){ S.doc.lines.splice(i,1); S.map=null; renderWork(); }

function doMapping(){
  if(!S.doc) return;
  const m = runMapping();
  renderWork();
  toast(m.pass ? '&#10003; Mapping ผ่าน — ข้อมูลครบถ้วน พร้อมส่งเข้า SAP'
               : '&#10007; Mapping ไม่ผ่าน — ไม่พบข้อมูล '+m.errors.length+' จุด');
  window.scrollTo({top:0,behavior:'smooth'});
}
function setManualHeader(k,v){
  if(!S.map) return;
  S.map.manual.header[k]=v;
  if(k==='customer') S.map.manual.header.shipTo='';
  runMapping(); renderWork();
}
function setManualLine(i,v){ if(!S.map) return; S.map.manual.lines[i]=v; runMapping(); renderWork(); }

function learn(i){
  const ln=S.doc.lines[i], code=S.map.lines[i].code;
  if(S.module==='SO'){
    MD.custMaterials.push({customerCode:S.map.header.customer.code, extCode:ln.extCode, extDesc:ln.desc, materialCode:code});
  }else{
    MD.vendorMaterials.push({vendorCode:S.map.header.vendor.code, extCode:ln.extCode, extDesc:ln.desc, materialCode:code});
  }
  saveMD(); runMapping(); renderWork();
  toast('บันทึกลง Master Mapping แล้ว — ครั้งถัดไประบบจะจับคู่อัตโนมัติ');
}

function showPayload(){
  const p = buildPayload();
  openModal(`<div class="card-h"><h2>Payload ที่จะส่งเข้า SAP</h2><div class="sp"></div>
    <button class="btn sm" onclick="closeModal()">&#10005;</button></div>
    <div class="card-b"><p class="hint">Endpoint: <code>${esc(p._target)}</code></p>
    <pre class="json">${esc(JSON.stringify(p,null,2))}</pre></div>`);
}

function postSAP(){
  const p = buildPayload();
  openModal(`<div class="card-h"><h2>ยืนยันการส่งเข้า SAP S/4HANA</h2></div><div class="card-b">
    <p>ระบบจะสร้างเอกสาร <b>${S.module==='SO'?'Sales Order':'Supplier Invoice (ตั้งหนี้ AP)'}</b> ในระบบ SAP</p>
    <div class="tw"><table style="min-width:auto"><tbody>
      ${S.module==='SO'
        ? `<tr><th>Sold-to</th><td>${esc(S.map.header.customer.code)} — ${esc(S.map.header.customer.text)}</td></tr>
           <tr><th>Ship-to</th><td>${esc(S.map.header.shipTo.code)} — ${esc(S.map.header.shipTo.text)}</td></tr>
           <tr><th>PO ลูกค้า</th><td>${esc(S.doc.header.poNo)}</td></tr>`
        : `<tr><th>Vendor</th><td>${esc(S.map.header.vendor.code)} — ${esc(S.map.header.vendor.text)}</td></tr>
           <tr><th>เลขที่ใบแจ้งหนี้</th><td>${esc(S.doc.header.invoiceNo)}</td></tr>`}
      <tr><th>จำนวนรายการ</th><td>${S.doc.lines.length} บรรทัด</td></tr>
      <tr><th>ยอดรวม</th><td><b>${fmt(S.doc.header.totalAmount)} ${esc(S.doc.header.currency||'THB')}</b></td></tr>
    </tbody></table></div>
    <div class="row" style="margin-top:16px"><button class="btn success" onclick="confirmPost()">ยืนยันส่งเข้า SAP</button>
    <button class="btn" onclick="closeModal()">ยกเลิก</button></div></div>`);
}
function confirmPost(){
  const no = (S.module==='SO'?'00':'51') + String(Math.floor(Math.random()*900000)+100000);
  S.posted=true; S.postedDoc=no; S.postedAt=new Date().toLocaleString('th-TH');
  LOG.unshift({at:S.postedAt, module:S.module, sapDoc:no, file:S.file,
    partner:S.module==='SO'?S.map.header.customer.text:S.map.header.vendor.text,
    ref:S.module==='SO'?S.doc.header.poNo:S.doc.header.invoiceNo,
    amount:fmt(S.doc.header.totalAmount), lines:S.doc.lines.length});
  saveLog(); closeModal(); renderWork();
  toast('&#10003; สร้างเอกสารใน SAP สำเร็จ — เลขที่ '+no);
  window.scrollTo({top:0,behavior:'smooth'});
}
function resetDoc(){ S.doc=null; S.map=null; S.file=null; S.posted=false; go(S.module?'work':'home'); }

/* ---------- PAGE: MASTER ---------- */
function renderMaster(){
  const keys = Object.keys(MASTER_DEF);
  const tabs = keys.map(k=>{
    const d=MASTER_DEF[k];
    const tag = d.mod==='ALL'?'':' <span class="badge b-idle">'+d.mod+'</span>';
    return `<button class="${S.masterTab===k?'on':''}" onclick="S.masterTab='${k}';renderMaster()">${d.label}${tag} <span class="muted">(${MD[k].length})</span></button>`;
  }).join('');
  const def = MASTER_DEF[S.masterTab], rows = MD[S.masterTab];
  const body = rows.map((r,i)=>'<tr>'+def.cols.map(c=>`<td>${esc(r[c.k])}</td>`).join('')+
    `<td style="white-space:nowrap"><button class="btn sm" onclick="editRow(${i})">แก้ไข</button>
     <button class="btn sm ghost" onclick="delRow(${i})">ลบ</button></td></tr>`).join('');

  $('#content').innerHTML = `
  <div class="card"><div class="card-h"><h2>Master Mapping — ข้อมูลหลักที่ใช้จับคู่แต่ละ Process</h2><div class="sp"></div>
    <button class="btn sm" onclick="exportMD()">&#8681; Export JSON</button>
    <button class="btn sm" onclick="importMD()">&#8679; Import JSON</button>
    <button class="btn sm" onclick="if(confirm('คืนค่าข้อมูลตัวอย่างทั้งหมด?')){MD=JSON.parse(JSON.stringify(SEED));saveMD();renderMaster();}">คืนค่าเริ่มต้น</button></div>
    <div class="tabs">${tabs}</div>
    <div class="card-b">
      <div class="row" style="margin-bottom:12px">
        <button class="btn primary sm" onclick="editRow(-1)">&#43; เพิ่มข้อมูล</button>
        <span class="hint">${mapNote(S.masterTab)}</span>
      </div>
      <div class="tw"><table>
        <thead><tr>${def.cols.map(c=>`<th>${esc(c.l)}</th>`).join('')}<th style="width:120px"></th></tr></thead>
        <tbody>${body||`<tr><td colspan="${def.cols.length+1}" class="empty">ยังไม่มีข้อมูล</td></tr>`}</tbody>
      </table></div>
    </div></div>`;
}
function mapNote(k){
  return {
    customers:'ใช้จับคู่ Sold-to: ตรวจจาก <b>เลขทะเบียนนิติบุคคล</b> ก่อน ถ้าไม่พบจึงเทียบ <b>ชื่อ</b> (ความคล้าย &ge; 82%)',
    shipTos:'ใช้จับคู่ Ship-to จาก <b>ชื่อสถานที่/ที่อยู่</b> ภายใต้ลูกค้าเดียวกัน',
    custMaterials:'ใช้แปลง <b>รหัส/ชื่อสินค้าของลูกค้า</b> เป็น Material ของ SAP',
    vendors:'ใช้จับคู่ Vendor: ตรวจจาก <b>เลขทะเบียนนิติบุคคล</b> ก่อน ถ้าไม่พบจึงเทียบ <b>ชื่อ</b>',
    vendorMaterials:'ใช้แปลง <b>รหัส/ชื่อสินค้าของผู้ขาย</b> เป็น Material ของ SAP',
    materials:'ข้อมูล Material ของ SAP (ควร replicate จาก S/4HANA)'
  }[k]||'';
}
function editRow(i){
  const def=MASTER_DEF[S.masterTab], r = i<0?{}:MD[S.masterTab][i];
  const fields = def.cols.map(c=>{
    if(c.k==='materialCode')
      return `<div class="f"><label>${esc(c.l)}</label><select id="fld_${c.k}">
        ${MD.materials.map(m=>`<option value="${esc(m.code)}" ${r[c.k]===m.code?'selected':''}>${esc(m.code)} — ${esc(m.desc)}</option>`).join('')}</select></div>`;
    if(c.k==='customerCode')
      return `<div class="f"><label>${esc(c.l)}</label><select id="fld_${c.k}">
        ${MD.customers.map(m=>`<option value="${esc(m.code)}" ${r[c.k]===m.code?'selected':''}>${esc(m.code)} — ${esc(m.name)}</option>`).join('')}</select></div>`;
    if(c.k==='vendorCode')
      return `<div class="f"><label>${esc(c.l)}</label><select id="fld_${c.k}">
        ${MD.vendors.map(m=>`<option value="${esc(m.code)}" ${r[c.k]===m.code?'selected':''}>${esc(m.code)} — ${esc(m.name)}</option>`).join('')}</select></div>`;
    return `<div class="f"><label>${esc(c.l)}</label><input id="fld_${c.k}" value="${esc(r[c.k]||'')}"></div>`;
  }).join('');
  openModal(`<div class="card-h"><h2>${i<0?'เพิ่ม':'แก้ไข'} — ${def.label}</h2><div class="sp"></div>
    <button class="btn sm" onclick="closeModal()">&#10005;</button></div>
    <div class="card-b"><div class="grid">${fields}</div>
    <div class="row" style="margin-top:16px"><button class="btn primary" onclick="saveRow(${i})">บันทึก</button>
    <button class="btn" onclick="closeModal()">ยกเลิก</button></div></div>`);
}
function saveRow(i){
  const def=MASTER_DEF[S.masterTab], o={};
  def.cols.forEach(c=>{ o[c.k]=document.getElementById('fld_'+c.k).value.trim(); });
  if(!o[def.key]){ toast('กรุณากรอก '+def.cols.find(c=>c.k===def.key).l); return; }
  if(i<0) MD[S.masterTab].push(o); else MD[S.masterTab][i]=o;
  saveMD(); closeModal(); renderMaster(); toast('บันทึกข้อมูลหลักเรียบร้อย');
  if(S.map) runMapping();
}
function delRow(i){ if(!confirm('ลบข้อมูลนี้?')) return; MD[S.masterTab].splice(i,1); saveMD(); renderMaster(); }
function exportMD(){
  const b=new Blob([JSON.stringify(MD,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='master_mapping.json'; a.click();
}
function importMD(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=()=>{ try{ const o=JSON.parse(rd.result); Object.keys(MASTER_DEF).forEach(k=>{ if(Array.isArray(o[k])) MD[k]=o[k]; }); saveMD(); renderMaster(); toast('นำเข้าข้อมูลหลักสำเร็จ'); }catch(e){ toast('ไฟล์ไม่ถูกต้อง'); } };
    rd.readAsText(f); };
  inp.click();
}

/* ---------- PAGE: LOG ---------- */
function renderLog(){
  const rows = LOG.map(l=>`<tr><td>${esc(l.at)}</td><td><span class="badge ${l.module==='AP'?'b-warn':'b-ok'}">${esc(l.module)}</span></td>
    <td><b>${esc(l.sapDoc)}</b></td><td>${esc(l.ref)}</td><td>${esc(l.partner)}</td>
    <td style="text-align:right">${esc(l.amount)}</td><td style="text-align:center">${l.lines}</td><td>${esc(l.file)}</td></tr>`).join('');
  $('#content').innerHTML=`<div class="card"><div class="card-h"><h2>ประวัติเอกสารที่ส่งเข้า SAP</h2><div class="sp"></div>
    <button class="btn sm" onclick="if(confirm('ล้างประวัติทั้งหมด?')){LOG=[];saveLog();renderLog();}">ล้างประวัติ</button></div>
    <div class="card-b"><div class="tw"><table>
      <thead><tr><th>เวลา</th><th>Module</th><th>เลขที่เอกสาร SAP</th><th>เอกสารอ้างอิง</th><th>คู่ค้า</th><th style="text-align:right">ยอดรวม</th><th>รายการ</th><th>ไฟล์ต้นทาง</th></tr></thead>
      <tbody>${rows||'<tr><td colspan="8" class="empty">ยังไม่มีเอกสารที่ส่งเข้า SAP</td></tr>'}</tbody>
    </table></div></div></div>`;
}

render();
</script>
</body>
</html>
